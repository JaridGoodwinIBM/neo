name: docs-audit-failure-alert

# The Docs Consistency Audit runs weekly. A failed run is only visible as a red
# run in the Actions tab, so a broken audit can go unnoticed for a week. This
# surfaces failures as an issue instead, reusing a single open issue so a
# recurring failure doesn't file one issue per week.

on:
  workflow_run:
    workflows: ["Docs Consistency Audit"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          LABEL: docs-audit-failure
        run: |
          set -euo pipefail

          # The issue is found again by label, so the label has to exist before
          # the issue is filed. Creating it is best-effort (it usually already
          # exists), but a genuine failure must not be hidden: if the label is
          # still missing afterwards, file the issue without it rather than
          # exiting 1 and losing the alert entirely.
          # Checked via an exact API lookup rather than `list | grep`: under
          # `pipefail` an early-exiting reader can SIGPIPE the producer and
          # report 141 for a *matching* pipeline, silently inverting the test.
          label_exists() {
            gh api "repos/$REPO/labels/$LABEL" >/dev/null 2>&1
          }

          if ! label_exists; then
            gh label create "$LABEL" --repo "$REPO" \
              --description "Docs Consistency Audit run failed" \
              --color B60205 || echo "::warning::could not create label '$LABEL'"
          fi

          # Carried in the positional params: unlike an empty array, `"$@"`
          # expands safely under `set -u` on every bash version.
          set --
          if label_exists; then
            set -- --label "$LABEL"
          else
            echo "::warning::label '$LABEL' unavailable; filing an unlabelled issue, which breaks reuse"
          fi

          body=$(printf '%s\n' \
            "The [Docs Consistency Audit]($RUN_URL) failed, so the docs were not audited." \
            "" \
            "| | |" \
            "|---|---|" \
            "| Run | [\`$RUN_ID\`]($RUN_URL) |" \
            "| Trigger | \`$RUN_EVENT\` |" \
            "| Branch | \`$RUN_BRANCH\` |" \
            "" \
            "The audit is weekly, so docs drift goes unchecked until this is fixed." \
            "" \
            "This issue is reused for repeat failures — check the comments for earlier occurrences. It does not close automatically; close it once a run succeeds.")

          # Reuse is label-based, so only look for a prior issue when the label
          # is actually in play. No error suppression here: a failed lookup
          # would otherwise read as "none open" and file a duplicate.
          existing=""
          if [ "$#" -gt 0 ]; then
            existing=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
              --limit 1 --json number --jq '.[0].number // empty')
          fi

          if [ -n "$existing" ]; then
            echo "Commenting on existing issue #${existing}"
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            echo "Creating new failure issue"
            gh issue create --repo "$REPO" \
              --title "Docs Consistency Audit failed" \
              "$@" \
              --body "$body"
          fi
